name: SpektraCam
options:
  bundleIdPrefix: com.spektrafilm
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "5.9"
    MTL_FAST_MATH: YES
    GCC_OPTIMIZATION_LEVEL: s
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  SpektraCam:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: SpektraCam
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: "SpektraCam requires direct access to the iPhone 13 Pro Max triple-camera system for 12-bit Apple ProRAW and 10-bit BT.2020 HLG Log spectral film capture."
        NSMicrophoneUsageDescription: "SpektraCam requires microphone access to record synchronized PCM audio during 10-bit Log and baked physical film video capture."
        NSPhotoLibraryUsageDescription: "SpektraCam requires photo library access to load and inspect captured DNG negatives and spectral prints."
        NSPhotoLibraryAddUsageDescription: "SpektraCam requires permission to save 16-bit spectral darkroom renders, 12-bit DNG files, and 10-bit ProRes/HEVC Log videos to your library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spektrafilm.spektracam
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
