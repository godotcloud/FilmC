name: Build Uncompressed iOS SpektraCam (iPhone 13 Pro Max)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-uncompressed-ipa:
    name: Build Unsigned & Ad-Hoc Signed Uncompressed IPA (arm64)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Stable Xcode Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun metal -v

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Verify Synchronized Source Tree & Calibrated Spectral Shaders
        run: |
          echo "Checking required source files..."
          for f in \
            "project.yml" \
            "Resources/Info.plist" \
            "Sources/App/SpektraCamApp.swift" \
            "Sources/Models/FilmSimulationParameters.swift" \
            "Sources/Models/FilmStockDatabase.swift" \
            "Sources/Metal/SpectralPipeline.metal" \
            "Sources/Metal/MetalFilmRenderer.swift" \
            "Sources/Camera/CameraCaptureService.swift" \
            "Sources/UI/SpektraCamUI.swift"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file $f"
              exit 1
            fi
          done
          grep -n "thread float &albedoScale" Sources/Metal/SpectralPipeline.metal
          grep -n "is10BitInput" Sources/Metal/SpectralPipeline.metal

      - name: Generate Xcode Project via XcodeGen (project.yml)
        run: |
          rm -rf SpektraCam.xcodeproj
          xcodegen generate --spec project.yml
          ls -la SpektraCam.xcodeproj

      - name: Pre-Compile & Validate Metal Compute Shaders (A15 Apple GPU Family 8)
        run: |
          xcrun -sdk iphoneos metal -c -std=ios-metal2.4 -mios-version-min=16.0 \
            -Wall -Wextra \
            Sources/Metal/SpectralPipeline.metal -o "${RUNNER_TEMP}/SpectralPipeline.air"
          xcrun -sdk iphoneos metallib "${RUNNER_TEMP}/SpectralPipeline.air" -o "${RUNNER_TEMP}/default.metallib"
          ls -lh "${RUNNER_TEMP}/default.metallib"

      - name: Build Release arm64 iOS App (No Code Signing Required)
        run: |
          xcodebuild clean build \
            -project SpektraCam.xcodeproj \
            -scheme SpektraCam \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET="16.0" \
            MTL_FAST_MATH=YES \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify Embedded default.metallib & Apply Clean Ad-Hoc Signature
        run: |
          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release-iphoneos/SpektraCam.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "Error: SpektraCam.app not found at ${APP_PATH}"
            exit 1
          fi

          # Ensure default.metallib is present inside the .app bundle (fallback copy if XcodeGen skipped shader bundling)
          if [ ! -f "${APP_PATH}/default.metallib" ]; then
            echo "Copying pre-verified default.metallib into SpektraCam.app..."
            cp "${RUNNER_TEMP}/default.metallib" "${APP_PATH}/default.metallib"
          fi
          ls -lh "${APP_PATH}/default.metallib"

          # Generate clean entitlements for SideStore / AltStore / Sideloadly / TrollStore compatibility
          cat > "${RUNNER_TEMP}/entitlements.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>com.spektrafilm.spektracam</string>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          EOF

          rm -rf "${APP_PATH}/_CodeSignature"
          codesign --force --deep --sign - --entitlements "${RUNNER_TEMP}/entitlements.plist" --timestamp=none "${APP_PATH}"
          codesign -vvv "${APP_PATH}" || true

      - name: Package Stage-1 Zero-Compression IPA (zip -0 Store Mode)
        run: |
          APP_PATH="${RUNNER_TEMP}/DerivedData/Build/Products/Release-iphoneos/SpektraCam.app"
          STAGE_DIR="${RUNNER_TEMP}/IPA_Staging"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/Payload"
          cp -R "${APP_PATH}" "${STAGE_DIR}/Payload/SpektraCam.app"

          cd "${STAGE_DIR}"
          # CRITICAL: -0 enforces STORE mode (zero deflate compression), -r recursive, -y preserve symlinks
          zip -0 -r -y "${GITHUB_WORKSPACE}/SpektraCam-Unsigned-Uncompressed.ipa" Payload
          ls -lh "${GITHUB_WORKSPACE}/SpektraCam-Unsigned-Uncompressed.ipa"

      - name: Upload Stage-2 Zero-Compression IPA Artifact (compression-level 0)
        uses: actions/upload-artifact@v4
        with:
          name: SpektraCam-iPhone13ProMax-Uncompressed-IPA
          path: ${{ github.workspace }}/SpektraCam-Unsigned-Uncompressed.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload Raw Uncompressed SpektraCam.app Bundle (compression-level 0)
        uses: actions/upload-artifact@v4
        with:
          name: SpektraCam-Raw-App-Bundle-Uncompressed
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/SpektraCam.app
          compression-level: 0
          if-no-files-found: error
