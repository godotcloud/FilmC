name: Build Unsigned SpektraCam iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA for iPhone 13 Pro Max (A15 Bionic)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project & Verify Metal Shaders
        run: |
          if [ -f "SpektraCam/project.yml" ]; then
            cd SpektraCam
          fi
          rm -f Sources/Models/FilmStockParameters.swift
          xcodegen generate
          xcrun -sdk iphoneos metal -c -O3 Sources/Metal/SpectralPipeline.metal -o /tmp/SpectralPipeline.air
          xcrun -sdk iphoneos metallib /tmp/SpectralPipeline.air -o /tmp/default.metallib
          echo "Metal shader compilation verified successfully."

      - name: Build Unsigned Release .app for arm64 (iOS Device)
        run: |
          if [ -f "SpektraCam/SpektraCam.xcodeproj/project.pbxproj" ]; then
            cd SpektraCam
          fi
          xcodebuild clean build \
            -project SpektraCam.xcodeproj \
            -scheme SpektraCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.spektrafilm.spektracam" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Uncompressed Unsigned SpektraCam.ipa
        run: |
          if [ -d "SpektraCam/build" ]; then
            cd SpektraCam
          fi
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "SpektraCam.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: SpektraCam.app not found!"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.spektrafilm.spektracam" "$APP_PATH/Info.plist" || true
          echo "Verified CFBundleIdentifier:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -0 -qry SpektraCam-Unsigned-iPhone13ProMax.ipa Payload
          ls -lh SpektraCam-Unsigned-iPhone13ProMax.ipa

      - name: Upload Uncompressed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpektraCam-Unsigned-IPA
          path: "**/build/SpektraCam-Unsigned-iPhone13ProMax.ipa"
          compression-level: 0
          if-no-files-found: error
